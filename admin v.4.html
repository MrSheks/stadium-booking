<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Master | Edit Capability</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .status-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 50; }
        .modal.active { display: flex; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-6 md:p-12 font-sans">

    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-12">
            <h1 class="text-4xl font-black text-slate-900 tracking-tighter uppercase italic">Control Panel</h1>
            <input id="search" onkeyup="filter()" type="text" placeholder="Search..." class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 w-96 font-bold outline-none">
        </header>

        <div class="bg-white rounded-[2.5rem] shadow-2xl overflow-hidden border border-slate-100">
            <table class="w-full text-left">
                <thead class="bg-slate-50 border-b">
                    <tr>
                        <th class="p-6 text-[10px] font-black text-slate-400 uppercase">Booking #</th>
                        <th class="p-6 text-[10px] font-black text-slate-400 uppercase">Customer</th>
                        <th class="p-6 text-[10px] font-black text-slate-400 uppercase">Reserveration Info</th>
                        <th class="p-6 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="divide-y divide-slate-50"></tbody>
            </table>
        </div>
    </div>

    <!-- EDIT MODAL -->
    <div id="editModal" class="modal">
        <div class="bg-white p-8 rounded-[2rem] w-full max-w-md shadow-2xl">
            <h2 class="text-xl font-black mb-6 uppercase italic">Edit Reservation #<span id="editIdDisplay"></span></h2>
            <input type="hidden" id="editBookingId">
            <div class="grid gap-4">
                <input id="editDate" type="date" class="p-4 bg-slate-50 border rounded-xl font-bold outline-none w-full">
                <div class="flex gap-2">
                    <input id="editStart" type="time" class="p-4 bg-slate-50 border rounded-xl font-bold outline-none w-1/2">
                    <input id="editEnd" type="time" class="p-4 bg-slate-50 border rounded-xl font-bold outline-none w-1/2">
                </div>
                <select id="editStadium" class="p-4 bg-slate-50 border rounded-xl font-bold outline-none w-full"></select>
            </div>
            <div class="flex gap-4 mt-8">
                <button onclick="closeModal()" class="w-1/2 py-4 font-black uppercase text-slate-400">Cancel</button>
                <button onclick="saveEdit()" class="w-1/2 py-4 bg-indigo-600 text-white rounded-xl font-black uppercase shadow-lg shadow-indigo-100">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        const _supabase = supabase.createClient('https://zcqvtjuziiwmqilaxgvc.supabase.co', 'sb_publishable_MbdH5VHmNnIiLmGfpPaL1Q_jXNXtivr');
        let allData = [];

        async function loadData() {
            const { data } = await _supabase.from('unified_admin_view').select('*');
            allData = data || [];
            render(allData);
            
            // Populate Stadium Dropdown in Modal once
            if(document.getElementById('editStadium').options.length === 0) {
                const { data: stadiums } = await _supabase.from('stadium').select('stadium_number');
                stadiums.forEach(s => {
                    const opt = new Option(`Stadium #${s.stadium_number}`, s.stadium_number);
                    document.getElementById('editStadium').add(opt);
                });
            }
        }

        function render(records) {
            document.getElementById('tableBody').innerHTML = records.map(r => `
                <tr class="hover:bg-slate-50/80 transition-colors">
                    <td class="p-6 text-sm font-black text-indigo-600">#${r.booking_number}</td>
                    <td class="p-6">
                        <div class="font-bold text-slate-800">${r.email}</div>
                        <div class="text-[10px] text-slate-400 font-bold uppercase italic">${r.customer_state || 'No State'}</div>
                    </td>
                    <td class="p-6">
                        <div class="font-bold text-slate-700 italic">Std ${r.stadium_number} | ${r.booking_date}</div>
                        <div class="text-xs font-bold text-slate-400">${r.booking_start} - ${r.booking_end}</div>
                    </td>
                    <td class="p-6 text-right flex justify-end gap-2">
                        <button onclick="openEdit(${JSON.stringify(r).replace(/"/g, '&quot;')})" class="bg-indigo-50 text-indigo-600 px-4 py-2 rounded-xl text-[10px] font-black uppercase hover:bg-indigo-600 hover:text-white transition-all">Edit</button>
                        <button onclick="deepDelete(${r.customer_id})" class="bg-red-50 text-red-600 px-4 py-2 rounded-xl text-[10px] font-black uppercase hover:bg-red-600 hover:text-white transition-all">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        function openEdit(r) {
            document.getElementById('editIdDisplay').innerText = r.booking_number;
            document.getElementById('editBookingId').value = r.booking_number;
            document.getElementById('editDate').value = r.booking_date;
            document.getElementById('editStart').value = r.booking_start;
            document.getElementById('editEnd').value = r.booking_end;
            document.getElementById('editStadium').value = r.stadium_number;
            document.getElementById('editModal').classList.add('active');
        }

        function closeModal() { document.getElementById('editModal').classList.remove('active'); }

        async function saveEdit() {
            const b_id = document.getElementById('editBookingId').value;
            const s_id = document.getElementById('editStadium').value;
            const date = document.getElementById('editDate').value;
            const t1 = document.getElementById('editStart').value;
            const t2 = document.getElementById('editEnd').value;

            // 1. Check for overlaps (using the edit-specific function)
            const { data: check } = await _supabase.rpc('check_stadium_overlap_edit', {
                target_booking_number: parseInt(b_id),
                target_stadium_id: parseInt(s_id),
                target_date: date,
                target_start: t1,
                target_end: t2
            });

            if (check[0].is_booked) {
                alert("❌ Cannot save: This stadium is already booked for the new time!");
                return;
            }

            // 2. Update Booking
            const { error } = await _supabase.from('booking').update({
                stadium_number: parseInt(s_id),
                booking_date: date,
                start_time: t1,
                end_time: t2
            }).eq('booking_number', b_id);

            if (error) alert(error.message);
            else {
                alert("✅ Booking Updated!");
                closeModal();
                loadData();
            }
        }

        async function deepDelete(cid) {
            if (confirm("Delete full record?")) {
                await _supabase.from('customer').delete().eq('customer_id', cid);
                loadData();
            }
        }

        function filter() {
            const q = document.getElementById('search').value.toLowerCase();
            render(allData.filter(r => r.email.toLowerCase().includes(q) || r.booking_date.includes(q)));
        }

        window.onload = loadData;
    </script>
</body>
</html>
